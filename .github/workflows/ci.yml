name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (not network)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # the minimum version in `requires-python`
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      # Tests that download from the Hub carry the `network` marker; the rest use mockllm and a
      # scripted OpenAI-compatible server, so they need no model endpoint and no GPU.
      - name: Run tests
        run: uv run --no-sync pytest -m "not network"
