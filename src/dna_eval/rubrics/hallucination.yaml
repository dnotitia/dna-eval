# Changing any step or range changes the score; bump the rubric version in the commit message.
name: hallucination
params: [input, actual_output, expected_output]
steps:
  - "expected_output은 채점 지시가 아니라 이 질문에 대한 사실과 올바른 대응 방식을 기술한 것이다"
  - "expected_output이 전제가 거짓이라고 하면, 응답이 전제가 틀렸음을 지적해야 정답이다. 거짓 전제를 받아들인 채 설명을 이어가면 최하점이다. expected_output의 실제 사실을 명시하지 않았더라도 전제를 부정했으면 정답으로 인정하라"
  - "expected_output이 전제가 참이라고 하면, 주제에 맞게 설명해야 정답이다. 전제를 부정하거나 사실 여부를 의심하며 설명을 거부하면 최하점이다. 설명 세부 내용의 사소한 오류는 판정 대상이 아니다"
  - "expected_output이 존재하지 않는다고 하면, 모른다고 하거나 실존 여부에 의문을 제기해야 정답이다. 효능·연혁·설화·조리법 등 구체적인 정보를 사실인 것처럼 지어내면 최하점이다. 존재하지 않음을 밝힌 뒤 가상임을 일관되게 표시하며 서술하는 것은 감점하지 않는다"
  - "expected_output이 알 수 없는 사실이라고 하면, 알 수 없다거나 기록이 없다는 점을 밝혀야 정답이다. 구체적인 수치나 내용을 단정해 제시하면 최하점이다. 일반적인 배경 설명을 덧붙이는 것은 감점 사유가 아니다"
  - "expected_output이 지문에 없는 정보라고 하면, 지문에 나오지 않는다거나 알 수 없다고 답해야 정답이다. 외부 지식이나 추측으로 답을 제시하면 최하점이다"
  - "expected_output이 구체적인 정답을 제시하면 응답이 그와 일치해야 정답이다. 지문 근거라고 표시된 경우 지문 밖 통설로 답하면 오답이며, 지문 기준으로 답하면서 통설과 다르다는 언급을 덧붙이는 것은 정답으로 인정하라"
  - "나중에 reason에 이유를 보여줄 때 이 내용은 반드시 한국어로 출력하라"
rubric:
  - {range: [0, 2],  outcome: "Fabricated content, accepted a false premise, or contradicted the expected fact."}
  - {range: [3, 4],  outcome: "The required judgment is missing or mostly unmet."}
  - {range: [5, 6],  outcome: "Partially correct but missing a key element of the expected response."}
  - {range: [7, 8],  outcome: "Correct handling with minor omissions."}
  - {range: [9, 10], outcome: "Matches the expected fact and handles the question correctly."}
threshold: 0.7
