[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-eval"
version = "0.1.0.dev0"
description = "Inspect AI tasks: the DNA suite (LLM-as-judge, driven by rubrics) and standard benchmarks"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "inspect-ai>=0.3.277",
  "datasets>=3.0",
  "huggingface_hub>=0.24",
  "pyyaml>=6",
  "pydantic>=2",
  "pandas>=2",
  "jinja2>=3",
  "openai>=1",
  "numpy>=1.26",
  # IFEval / IFBench verifiers (vendor/ifbench, imported by the registry). Pinned where they
  # decide a verdict (decision record 0021): sentence splitting, language detection, emoji and
  # syllable counts.
  "absl-py",
  "immutabledict",
  "emoji~=2.16.0",
  "langdetect==1.0.9",
  "nltk~=3.10.3",
  "syllapy~=0.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "h5py>=3.8", "scipy", "sympy", "math-verify[antlr4_13_2]~=0.9.0"]
# math answer equivalence (hrm8k_ksm); pinned, it decides which answers count as equal (0021)
math = ["math-verify[antlr4_13_2]~=0.9.0"]
# SciCode reads its 1 GB test-data file on the host
scicode = ["h5py>=3.8"]
# Harbor-format agent tasks (Terminal-Bench, SWE-bench, DeepSWE) and their agent scaffolds
agentic = [
  "inspect-harbor==1.0.0; python_version >= '3.12'",
  "inspect-swe==0.2.71",
]

[project.entry-points.inspect_ai]
dna_eval = "dna_eval._registry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dna_eval = ["rubrics/*.yaml", "vendor/*/LICENSE", "vendor/*/NOTICE.md", "vendor/scicode/*.txt",
            "tasks/benchmarks/scicode_sandbox/*"]

[tool.pytest.ini_options]
# src layout: make the package and the tests package importable without `pip install -e .`
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["network: needs network access (Hub datasets, some of them gated, or pinned downloads)"]
