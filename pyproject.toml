[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-eval"
version = "0.1.0.dev0"
description = "The DNA evaluation suite: LLM-judged tasks used to evaluate the DNA model family, on Inspect AI"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "inspect-ai>=0.3.277",
  "datasets>=3.0",
  "huggingface_hub>=0.24",
  "pyyaml>=6",
  "pydantic>=2",
  "pandas>=2",
  "jinja2>=3",
  "openai>=1",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points.inspect_ai]
dna_eval = "dna_eval._registry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dna_eval = ["rubrics/*.yaml"]

[tool.pytest.ini_options]
# src layout: make the package and the tests package importable without `pip install -e .`
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["network: needs network access (Hub datasets)"]
